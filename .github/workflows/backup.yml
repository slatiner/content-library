# Weekly encrypted backup of the Supabase database (#27). The free tier keeps no
# backups of its own. Follows Supabase's CLI backup steps (roles, schema, data,
# including auth users) and encrypts the bundle with age before upload: artifacts
# on a public repo can be downloaded by any signed-in GitHub user, and the data
# holds notes and emails. Only the holder of the age private key can read it.
#
# Secrets: SUPABASE_DB_URL (session pooler connection string, percent-encoded;
# runners have no IPv6 for the direct connection) and AGE_RECIPIENT (the public
# key, age1...). Restore test: scripts/restore-test.sh.
name: Supabase backup

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Dump roles, schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir dump
          supabase db dump --db-url "$DB_URL" -f dump/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$DB_URL" -f dump/data.sql --use-copy --data-only
          grep -q 'COPY "public"."entries"' dump/data.sql
          grep -q 'COPY "auth"."users"' dump/data.sql
          wc -c dump/*
      - name: Encrypt
        env:
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          name="supabase-backup-$(date -u +%Y-%m-%d)"
          echo "NAME=$name" >> "$GITHUB_ENV"
          tar -C dump -czf - . | age -r "$AGE_RECIPIENT" -o "$name.tgz.age"
          rm -rf dump
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tgz.age
          retention-days: 90
